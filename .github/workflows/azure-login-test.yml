name: Azure OIDC login test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read workshop resource group
        run: az group show --name rg-fabcon26-dev-swc --query "{name:name, location:location}" -o table