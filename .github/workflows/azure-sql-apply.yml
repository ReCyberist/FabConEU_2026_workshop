name: Azure SQL — Terraform apply

# Manually provisions Azure SQL infra into the personal sandbox subscription. TWO independent
# Terraform flows live here as separate jobs; the `target` input picks which run:
#   • demo     — the taught module (infra/azure-sql/terraform) + DACPAC publish/smoke test.
#   • attendee — the shared, unsupported attendee endpoint (infra/azure-sql/shared-endpoint):
#                elastic pool + a database/login per attendee, for the "bump the count" demo.
#   • both     — both flows (default).
# workflow_dispatch-only — these create real, billed resources, so nothing runs on a push.
#
# Auth: OIDC (no secrets) — see notes/decisions.md D5. State: remote azurerm backend in the
# persistent rg-fabcon26-state-weu resource group (separate from the workload RGs so the
# destroy workflows never touch the state store), a distinct state key per flow. Each flow's
# apply carries a JOB-LEVEL concurrency group matching its own destroy workflow, so an apply
# can't run over that flow's state — while the two flows stay independent of each other.
#
# Region: this Azure Sponsorship subscription can't provision SQL in West Europe, so
# AZURE_LOCATION/AZURE_LOCATION_ABBREVIATION (=uksouth/uks) drive the region.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which flow(s) to apply
        type: choice
        options:
          - both
          - demo
          - attendee
        default: both

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token for azure/login-free ARM auth

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

jobs:
  apply:
    name: terraform apply (demo)
    if: ${{ inputs.target == 'demo' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    # Shares a group with azure-sql-destroy.yml so demo apply/destroy can't overlap.
    concurrency:
      group: azure-sql-terraform
      cancel-in-progress: false
    outputs:
      server_fqdn: ${{ steps.tf.outputs.server_fqdn }}
      database_name: ${{ steps.tf.outputs.database_name }}
    defaults:
      run:
        working-directory: infra/azure-sql/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.12.0'

      - name: Terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure-sql/dev.terraform.tfstate"

      - name: Terraform plan
        run: |
          terraform plan -out=tfplan \
            -var="entra_admin_login=${{ vars.SQL_ENTRA_ADMIN_LOGIN }}" \
            -var="entra_admin_object_id=${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}" \
            -var="location=${{ vars.AZURE_LOCATION }}" \
            -var="location_abbreviation=${{ vars.AZURE_LOCATION_ABBREVIATION }}" \
            -var="presenter_client_ips=[\"${{ secrets.ROB_CLIENT_IP }}\",\"${{ secrets.JESS_CLIENT_IP }}\"]"

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      # Surface the provisioned server/database names so the publish job can target them
      # without hard-coding the random server suffix.
      - name: Expose Terraform outputs
        id: tf
        run: |
          echo "server_fqdn=$(terraform output -raw sql_server_fqdn)" >> "$GITHUB_OUTPUT"
          echo "database_name=$(terraform output -raw sql_database_name)" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------------------
  # DB-as-code: publish the FabConFootball DACPAC into the just-provisioned database.
  # Runs only after a successful apply and targets that apply's Terraform outputs, so the
  # whole "infra + database as code" story is one dispatch.
  #
  # AUTH PREREQUISITE (see planning/tasks.md #18): the SQL server is Entra-only and its
  # admin is a human user, so the GitHub Actions OIDC service principal cannot log into the
  # database yet. Until the CI principal is granted DB access — recommended: make the
  # server's Entra admin a *group* containing both the presenter and the CI SP — this job
  # will authenticate but fail at the database login. The job mechanics are otherwise
  # complete and correct.
  # -------------------------------------------------------------------------------------
  publish:
    name: publish DACPAC
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # RunSqlCodeAnalysis is on in the .sqlproj, so this compiles the schema to a DACPAC
      # and runs T-SQL static analysis; -warnaserror fails the build on any smell.
      - name: Build DACPAC
        run: dotnet build database/sql-projects/FabConFootball.sqlproj --configuration Release -warnaserror

      - name: Install SqlPackage
        run: |
          dotnet tool install -g microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Mint a Microsoft Entra access token for the Azure SQL resource. Kept out of source
      # and masked in the log — nothing secret is stored.
      - name: Acquire Entra token for Azure SQL
        run: |
          token=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "SQL_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      # The "database plan": DeployReport is the DB's answer to `terraform plan` — it reports
      # exactly what the publish below WOULD do (incl. <Alert Name="DataIssue"> data-loss
      # operations) without changing anything. Informational; the actual guard is
      # BlockOnPossibleDataLoss=True in the profile. Underpins the #15/#21 "ship changes" story.
      - name: Deploy report (DB plan)
        run: |
          sqlpackage /Action:DeployReport \
            /SourceFile:"database/sql-projects/bin/Release/FabConFootball.dacpac" \
            /Profile:"database/sql-projects/PublishProfiles/AzureSql.publish.xml" \
            /TargetServerName:"${{ needs.apply.outputs.server_fqdn }}" \
            /TargetDatabaseName:"${{ needs.apply.outputs.database_name }}" \
            /AccessToken:"$SQL_ACCESS_TOKEN" \
            /OutputPath:"deploy-report.xml"
          echo "----- data-loss / warning operations in the plan -----"
          grep -iE "DataIssue|data loss|<Operation" deploy-report.xml || echo "None reported."

      - name: Upload deploy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: azure-sql-deploy-report
          path: deploy-report.xml
          if-no-files-found: ignore

      # Passwordless publish: the profile carries the deploy options (no connection string);
      # server/database come from the apply job's Terraform outputs, auth from the Entra token.
      - name: Publish DACPAC
        run: |
          sqlpackage /Action:Publish \
            /SourceFile:"database/sql-projects/bin/Release/FabConFootball.dacpac" \
            /Profile:"database/sql-projects/PublishProfiles/AzureSql.publish.xml" \
            /TargetServerName:"${{ needs.apply.outputs.server_fqdn }}" \
            /TargetDatabaseName:"${{ needs.apply.outputs.database_name }}" \
            /AccessToken:"$SQL_ACCESS_TOKEN"

      # Post-publish smoke test: prove the deployed schema actually serves data, not just
      # that the objects exist. Reuses the same Entra token (no new secret) via the
      # SqlServer module's Invoke-Sqlcmd -AccessToken. The seed populates all nine tables,
      # so the stable views must return rows; vw_UpcomingFixtures is date-relative (fixtures
      # seeded as "upcoming" may now be in the past), so it's executed but not row-asserted.
      - name: Smoke-test the deployed database
        shell: pwsh
        env:
          SQL_SERVER: ${{ needs.apply.outputs.server_fqdn }}
          SQL_DATABASE: ${{ needs.apply.outputs.database_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host 'Installing SqlServer module...'
          Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber | Out-Null

          $server = $env:SQL_SERVER
          $db     = $env:SQL_DATABASE
          $token  = $env:SQL_ACCESS_TOKEN

          function Test-Query([string]$Label, [string]$Query, [switch]$MustHaveRows) {
              $rows = Invoke-Sqlcmd -ServerInstance $server -Database $db -AccessToken $token `
                  -EncryptConnection -Query $Query
              $count = @($rows).Count
              if ($MustHaveRows -and $count -eq 0) {
                  throw "FAIL  $Label - expected rows, got 0"
              }
              Write-Host "OK    $Label - $count row(s)"
              return $rows
          }

          Test-Query 'table  football.Club'          'SELECT TOP (1) 1 AS present FROM football.Club'              -MustHaveRows | Out-Null
          Test-Query 'table  football.Fixture'       'SELECT TOP (1) 1 AS present FROM football.Fixture'           -MustHaveRows | Out-Null
          Test-Query 'view   vw_LeagueTable'         'SELECT TOP (1) 1 AS present FROM football.vw_LeagueTable'    -MustHaveRows | Out-Null
          Test-Query 'view   vw_TopScorers'          'SELECT TOP (1) 1 AS present FROM football.vw_TopScorers'     -MustHaveRows | Out-Null
          Test-Query 'view   vw_UpcomingFixtures'    'SELECT TOP (1) 1 AS present FROM football.vw_UpcomingFixtures' | Out-Null

          # Execute the parameterised proc with a competition/season that actually has standings.
          $key = Invoke-Sqlcmd -ServerInstance $server -Database $db -AccessToken $token `
              -EncryptConnection -Query 'SELECT TOP (1) CompetitionId, SeasonId FROM football.vw_LeagueTable'
          $exec = "EXEC football.usp_GetLeagueTable @CompetitionId = $($key.CompetitionId), @SeasonId = $($key.SeasonId)"
          Test-Query 'proc   usp_GetLeagueTable'     $exec                                                          -MustHaveRows | Out-Null

          Write-Host 'Smoke test passed.'

  # -------------------------------------------------------------------------------------
  # Second Terraform flow: the shared, UNSUPPORTED attendee endpoint
  # (infra/azure-sql/shared-endpoint) — one server + elastic pool + a database/login per
  # attendee. Independent of the demo jobs above (own state key, own concurrency group). No
  # DACPAC publish here: attendees publish their own schemas into their own databases.
  #
  # Deploys whatever attendee_count is committed in variables.tf (default 10) — so committing
  # a count change and running this workflow deploys that new count (the "bump the count"
  # demo). Torn down nightly by shared-endpoint-destroy.yml.
  # -------------------------------------------------------------------------------------
  attendee-endpoint:
    name: terraform apply (attendee endpoint)
    if: ${{ inputs.target == 'attendee' || inputs.target == 'both' }}
    runs-on: ubuntu-latest
    # Shares a group with shared-endpoint-destroy.yml so this flow's apply/destroy can't overlap.
    concurrency:
      group: azure-sql-shared-endpoint-terraform
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/azure-sql/shared-endpoint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.12.0'

      - name: Terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure-sql/shared-endpoint.terraform.tfstate"

      # attendee_count is intentionally NOT passed here — it comes from the committed
      # variables.tf default, so committing a count change and running this deploys that count.
      - name: Terraform plan
        run: |
          terraform plan -out=tfplan \
            -var="location=${{ vars.AZURE_LOCATION }}" \
            -var="location_abbreviation=${{ vars.AZURE_LOCATION_ABBREVIATION }}"

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

      # Attendee handout in the run summary: server, shared password, and a ready-to-paste
      # connection string per attendee. Giveaways by design; the admin password is a separate
      # sensitive output and is deliberately NOT printed.
      - name: Publish attendee handout to the run summary
        run: |
          {
            echo "## Shared endpoint — attendee handout"
            echo ""
            echo "- **Server:** \`$(terraform output -raw sql_server_fqdn)\`"
            echo "- **Shared password:** \`$(terraform output -raw attendee_password)\`"
            echo "- **Attendees:** $(terraform output -raw attendee_count)"
            echo ""
            echo "Each attendee uses login \`attendeeNN\` against database \`sqldb-attendeeNN\`."
            echo ""
            echo "### Connection strings"
            echo '```'
            terraform output -json attendee_connection_strings \
              | jq -r 'to_entries[] | "\(.key): \(.value)"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
