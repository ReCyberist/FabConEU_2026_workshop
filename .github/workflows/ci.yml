name: CI

# Validates the code in this repo on every push and pull request.
# Start small, grow with the repo: add a job per area as we build it out.
#
# Planned jobs (add as each lands — see planning/tasks.md):
#   - database      ✅  build the SQL project + T-SQL static code analysis
#   - docs          ✅  mkdocs build --strict (only when docs change)
#   - terraform     ✅  fmt check + validate (infra/**/terraform)
#   - bicep         ✅  az bicep build (infra/**/bicep)
#   - markdown          link / lint check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read   # dorny/paths-filter reads a PR's changed files via the API

jobs:
  database:
    name: Build SQL project + code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # RunSqlCodeAnalysis is enabled in the .sqlproj, so this both compiles the schema
      # to a DACPAC and runs T-SQL static code analysis. -warnaserror makes any smell or
      # model warning fail the build.
      - name: Build & analyse
        run: dotnet build database/sql-projects/FabConFootball.sqlproj --configuration Release -warnaserror

      - name: Upload DACPAC
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FabConFootball-dacpac
          path: database/sql-projects/bin/Release/FabConFootball.dacpac
          if-no-files-found: error

      - name: Upload code analysis results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sql-code-analysis-results
          path: database/sql-projects/bin/Release/FabConFootball.StaticCodeAnalysis.Results.xml
          if-no-files-found: ignore

  docs:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # paths-filter needs history to diff against the base

      # Only build the site when the docs (or their config) actually change.
      - name: Detect docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'requirements.txt'

      - name: Set up Python
        if: steps.filter.outputs.docs == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        if: steps.filter.outputs.docs == 'true'
        run: pip install -r requirements.txt

      # --strict fails on broken links, missing nav entries, and config warnings.
      - name: Build site (strict)
        if: steps.filter.outputs.docs == 'true'
        run: mkdocs build --strict

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # paths-filter needs history to diff against the base

      # Only validate when Terraform (or this workflow) actually changes.
      - name: Detect terraform changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            terraform:
              - 'infra/**/*.tf'
              - 'infra/**/.terraform.lock.hcl'
              - '.github/workflows/ci.yml'

      - name: Set up Terraform
        if: steps.filter.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v4

      # fmt is repo-wide over infra/ (only touches .tf files); a mis-formatted
      # module fails the check without needing provider init.
      - name: Terraform fmt (check)
        if: steps.filter.outputs.terraform == 'true'
        run: terraform fmt -check -recursive infra

      # validate each module offline: -backend=false skips the azurerm backend
      # (no Azure creds needed); the committed .terraform.lock.hcl pins providers.
      - name: Terraform validate (each module)
        if: steps.filter.outputs.terraform == 'true'
        run: |
          set -euo pipefail
          for dir in \
            infra/azure-sql/terraform \
            infra/azure-sql/shared-endpoint \
            infra/fabric-sql/terraform \
            infra/fabric-sql/automation; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  bicep:
    name: Bicep build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # paths-filter needs history to diff against the base

      - name: Detect bicep changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            bicep:
              - 'infra/**/*.bicep'
              - 'infra/**/*.bicepparam'
              - '.github/workflows/ci.yml'

      # az is preinstalled on the runner; install the bicep CLI it invokes.
      - name: Install Bicep
        if: steps.filter.outputs.bicep == 'true'
        run: az bicep install

      # build compiles each entrypoint (+ its referenced modules) to ARM JSON
      # with no Azure connection; --stdout keeps the compiled JSON out of the tree.
      # Fails on compilation errors; any linter warnings surface in the log (the
      # templates currently compile clean — keep them that way for the front row).
      - name: Bicep build (templates + params)
        if: steps.filter.outputs.bicep == 'true'
        run: |
          set -euo pipefail
          for f in infra/azure-sql/bicep/main.bicep infra/fabric-sql/bicep/main.bicep; do
            echo "::group::bicep build $f"
            az bicep build --file "$f" --stdout > /dev/null
            echo "::endgroup::"
          done
          for p in infra/azure-sql/bicep/main.bicepparam infra/fabric-sql/bicep/main.bicepparam; do
            echo "::group::bicep build-params $p"
            az bicep build-params --file "$p" --stdout > /dev/null
            echo "::endgroup::"
          done
