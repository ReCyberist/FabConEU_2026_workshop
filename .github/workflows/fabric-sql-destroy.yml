name: Fabric SQL — Terraform destroy

# Nightly CLEAN-SLATE teardown of the Fabric SQL module (workspace + SQL database) at 21:00
# UTC + on demand. Mirrors azure-sql-destroy.yml; same remote state key as fabric-sql-apply.yml.
# Decision: issue #35 — we want a known, freshly-seeded state each morning (re-run
# fabric-sql-apply to recreate). Cost is already handled by the every-2h capacity pause (#23);
# this is about a clean slate, not billing.
#
# DON'T WAKE SLEEPING FABRIC: first we read Terraform state (no capacity calls) — if nothing has
# been deployed since the last destroy (no fabric_workspace.this in state), we bail out and leave
# the capacity asleep. No point resuming (and billing) a capacity just to destroy nothing.
#
# EXISTING-CAPACITY MODE (FABRIC_USE_EXISTING_CAPACITY): the capacity is a read-only data
# source, so `terraform destroy` removes ONLY the workspace + SQL database and can NEVER touch
# the capacity itself. BUT deleting Fabric items needs an ACTIVE capacity, so when there IS a
# deployment this workflow:
#   1. RESUMES the capacity (the every-2h pause has usually suspended it by 21:00),
#   2. terraform destroy (workspace + DB),
#   3. RE-PAUSES the capacity so it isn't left billing (the every-2h would catch it anyway).
# The resume/pause steps are skipped in create-as-code mode (the module makes+destroys its own
# F-SKU). Resume/pause is done by the Tenant B CI SP via the ARM resume/suspend actions
# (mirrors infra/fabric-sql/automation runbooks) — it needs Contributor on the capacity (#35).
#
# Auth: OIDC, CROSS-TENANT — the Terraform state backend authenticates to Tenant A via ARM_*,
# while the azurerm + fabric providers (and the az-CLI resume/pause) authenticate to Tenant B
# (TF_VAR_fabric_* / FABRIC_*).

on:
  schedule:
    - cron: '0 21 * * *'   # 21:00 UTC — 9pm GMT / 10pm BST
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # --- Terraform state backend -> Tenant A (unchanged identity) ---
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # --- azurerm provider (Fabric capacity) -> Tenant B (pinned in providers.tf via TF_VAR_*) ---
  TF_VAR_fabric_client_id: ${{ vars.FABRIC_CLIENT_ID }}
  TF_VAR_fabric_tenant_id: ${{ vars.FABRIC_TENANT_ID }}
  TF_VAR_fabric_subscription_id: ${{ vars.FABRIC_SUBSCRIPTION_ID }}
  TF_VAR_fabric_use_oidc: true
  # --- fabric provider (workspace + SQL DB) -> Tenant B ---
  FABRIC_USE_OIDC: true
  FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
  FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
  # --- capacity admins: presenter UPNs (the CI SP is auto-added as the caller) ---
  TF_VAR_capacity_admin_members: ${{ vars.FABRIC_CAPACITY_ADMIN_UPNS }}
  # --- existing-capacity mode (see fabric-sql-apply.yml). CRITICAL for destroy: in this mode
  #     the capacity is a read-only data source, so `terraform destroy` removes only the
  #     workspace + SQL database and CANNOT touch the capacity. Unset => create-as-code path. ---
  TF_VAR_use_existing_capacity: ${{ vars.FABRIC_USE_EXISTING_CAPACITY || 'false' }}
  TF_VAR_existing_capacity_name: ${{ vars.FABRIC_EXISTING_CAPACITY_NAME }}
  TF_VAR_existing_capacity_resource_group: ${{ vars.FABRIC_EXISTING_CAPACITY_RG }}
  # --- workspace admins (Entra USER object ids, JSON array). Unset => SP-only. ---
  TF_VAR_workspace_admin_object_ids: ${{ vars.FABRIC_WORKSPACE_ADMIN_OBJECT_IDS || '[]' }}

concurrency:
  group: fabric-sql-terraform
  cancel-in-progress: false

jobs:
  destroy:
    name: terraform destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/fabric-sql/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.12.0'

      # Init first (Tenant A backend only — no capacity calls) so we can read state before
      # deciding whether to wake anything.
      - name: Terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=fabric-sql/dev.terraform.tfstate"

      # Don't wake sleeping Fabric. Reads ONLY the Terraform state (no capacity/API calls, so the
      # capacity stays asleep) to see whether a workspace is currently deployed. A destroy removes
      # fabric_workspace.this from state and an apply puts it back, so its presence is exactly
      # "did we deploy anything since the last destroy?". If nothing's deployed, we skip the
      # resume → destroy → re-pause entirely and leave the capacity paused.
      - name: Don't wake sleeping Fabric
        id: check
        run: |
          if terraform state list | grep -qxF 'fabric_workspace.this'; then
            echo "A workspace is deployed — proceeding with teardown."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing deployed since the last destroy — leaving the capacity asleep. 😴"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
          fi

      # Resume/pause only apply when binding to an existing capacity — in create-as-code mode the
      # module provisions and destroys its own F-SKU, so there's nothing to resume.
      - name: Azure login (Tenant B, for capacity resume/pause)
        if: ${{ steps.check.outputs.deployed == 'true' && vars.FABRIC_USE_EXISTING_CAPACITY == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.FABRIC_CLIENT_ID }}
          tenant-id: ${{ vars.FABRIC_TENANT_ID }}
          subscription-id: ${{ vars.FABRIC_SUBSCRIPTION_ID }}

      # Deleting the workspace + SQL database needs an ACTIVE capacity; the every-2h automation
      # has usually paused it by now. Resume (if not already Active) and wait for it.
      - name: Resume capacity
        if: ${{ steps.check.outputs.deployed == 'true' && vars.FABRIC_USE_EXISTING_CAPACITY == 'true' }}
        run: |
          CAP_ID="/subscriptions/${{ vars.FABRIC_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_EXISTING_CAPACITY_RG }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_EXISTING_CAPACITY_NAME }}"
          state=$(az resource show --ids "$CAP_ID" --api-version 2023-11-01 --query "properties.state" -o tsv)
          echo "Capacity state: $state"
          if [ "$state" != "Active" ]; then
            echo "Resuming $CAP_ID"
            az rest --method post --url "https://management.azure.com${CAP_ID}/resume?api-version=2023-11-01"
            for i in $(seq 1 30); do
              state=$(az resource show --ids "$CAP_ID" --api-version 2023-11-01 --query "properties.state" -o tsv)
              echo "  waiting... state=$state"
              [ "$state" = "Active" ] && break
              sleep 10
            done
            [ "$state" = "Active" ] || { echo "Capacity did not reach Active in time" >&2; exit 1; }
          fi
          echo "Capacity is Active."

      - name: Terraform destroy
        if: ${{ steps.check.outputs.deployed == 'true' }}
        run: |
          terraform destroy -auto-approve \
            -var="location=${{ vars.AZURE_LOCATION }}" \
            -var="location_abbreviation=${{ vars.AZURE_LOCATION_ABBREVIATION }}"

      # Re-pause so the capacity isn't left billing after the teardown. Runs even if destroy
      # failed (always()), but only if we actually resumed. The every-2h automation is the backstop.
      - name: Re-pause capacity
        if: ${{ always() && steps.check.outputs.deployed == 'true' && vars.FABRIC_USE_EXISTING_CAPACITY == 'true' }}
        run: |
          CAP_ID="/subscriptions/${{ vars.FABRIC_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.FABRIC_EXISTING_CAPACITY_RG }}/providers/Microsoft.Fabric/capacities/${{ vars.FABRIC_EXISTING_CAPACITY_NAME }}"
          echo "Suspending $CAP_ID"
          az rest --method post --url "https://management.azure.com${CAP_ID}/suspend?api-version=2023-11-01" \
            || echo "Suspend call failed — the every-2h pause automation will catch it."
