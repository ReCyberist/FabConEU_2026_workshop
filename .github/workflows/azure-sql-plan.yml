name: Azure SQL — Terraform plan (PR)

# Read-only verification for pull requests that touch the Azure SQL infra modules.
# Runs `terraform fmt`/`validate`/`plan` only — it NEVER applies — so reviewers can see the
# intended change in the PR checks before anything is provisioned. Actually creating or
# changing resources stays a deliberate, manual action from main (see azure-sql-apply.yml,
# which is workflow_dispatch-only and named "apply" on purpose).
#
# TWO Terraform flows run here as separate jobs:
#   1. plan               — the taught module (infra/azure-sql/terraform/demo).
#   2. plan-shared-endpoint — the shared attendee endpoint (infra/azure-sql/terraform/shared-endpoint).
# The second one powers the "bump attendee_count" demo: change the count in a PR, push, and
# the plan job prints exactly the databases/logins/users it would add.
#
# Auth: OIDC (no secrets). A pull_request run's OIDC subject is
# repo:<owner>/<repo>:pull_request — matched by the `fabcon26-github-pr` federated
# credential on the fabcon26-github-actions app (the `...:ref:refs/heads/main` credential
# only covers main, which is why plan needs its own). State: the same remote azurerm
# backend as apply, read with -lock=false so a PR plan never blocks the real apply/destroy.

on:
  pull_request:
    paths:
      - 'infra/azure-sql/terraform/demo/**'
      - 'infra/azure-sql/terraform/shared-endpoint/**'
      - '.github/workflows/azure-sql-plan.yml'

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token for passwordless ARM auth
  pull-requests: write   # required to post/update the plan comment on the PR

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

concurrency:
  group: azure-sql-terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure-sql/terraform/demo
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.12.0'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure-sql/dev.terraform.tfstate"

      - name: Terraform validate
        run: terraform validate

      # Read-only: shows what an apply *would* do. -lock=false because a plan never mutates
      # state, so it should not contend for the lock with a running apply/destroy.
      # id + continue-on-error: capture the plan output (the setup-terraform wrapper exposes
      # it as steps.plan.outputs.stdout) and still post the comment even if the plan errors —
      # the job is failed afterwards by the gate step below.
      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -lock=false \
            -var="entra_admin_login=${{ vars.SQL_ENTRA_ADMIN_LOGIN }}" \
            -var="entra_admin_object_id=${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}" \
            -var="location=${{ vars.AZURE_LOCATION }}" \
            -var="location_abbreviation=${{ vars.AZURE_LOCATION_ABBREVIATION }}" \
            -var="presenter_client_ips=[\"${{ secrets.ROB_CLIENT_IP }}\",\"${{ secrets.JESS_CLIENT_IP }}\"]"

      # This plan prints the presenter firewall IPs (from secrets) in the diff, so they are
      # passed to `mask` and redacted before the comment is written. See the action's header.
      - name: Comment plan on PR
        uses: ./.github/actions/tf-plan-comment
        with:
          header: Azure SQL — Terraform plan
          outcome: ${{ steps.plan.outcome }}
          plan: ${{ steps.plan.outputs.stdout }}
          mask: |
            ${{ secrets.ROB_CLIENT_IP }}
            ${{ secrets.JESS_CLIENT_IP }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Fail the job if the plan itself failed (continue-on-error swallowed it above).
      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Second Terraform flow: the shared, unsupported attendee endpoint. This is the "bump
  # attendee_count" demo target — a PR that changes the count shows the exact +N databases /
  # +N logins / +N users here.
  plan-shared-endpoint:
    name: terraform plan (shared endpoint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure-sql/terraform/shared-endpoint
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.12.0'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      # Its own state key, in the same backend as everything else (D5).
      - name: Terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure-sql/shared-endpoint.terraform.tfstate"

      - name: Terraform validate
        run: terraform validate

      # Read-only. -lock=false: a plan never mutates state. -refresh=false: compute the diff
      # from state + config only, so the plan does NOT try to reach the SQL server (the
      # mssql provider would otherwise connect to refresh logins/users) — the plan still
      # works when the endpoint is torn down between sessions, and it surfaces exactly the
      # config change (the bumped attendee_count) without depending on the DB being up.
      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -lock=false -refresh=false \
            -var="location=${{ vars.AZURE_LOCATION }}" \
            -var="location_abbreviation=${{ vars.AZURE_LOCATION_ABBREVIATION }}"

      # No secret -vars here, so nothing to mask. This is the "bump attendee_count" demo
      # comment: the +N databases / +N logins / +N users land right on the PR.
      - name: Comment plan on PR
        uses: ./.github/actions/tf-plan-comment
        with:
          header: Azure SQL shared endpoint — Terraform plan
          outcome: ${{ steps.plan.outcome }}
          plan: ${{ steps.plan.outputs.stdout }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
