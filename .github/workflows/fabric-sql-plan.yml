name: Fabric SQL — Terraform plan (PR)

# Read-only verification for PRs touching the Fabric SQL Terraform module. Runs
# fmt/validate/plan only — never apply. Mirrors azure-sql-plan.yml; the Fabric twist is that
# it needs BOTH provider auths: azurerm (for the Microsoft.Fabric/capacities resource + the
# state backend) and the microsoft/fabric provider (for the workspace + SQL database).
#
# Auth: OIDC, passwordless, CROSS-TENANT — the Terraform state backend authenticates to
# Tenant A via ARM_*, while the azurerm + fabric providers authenticate to Tenant B
# (TF_VAR_fabric_* + FABRIC_*). See planning/2026-08-05-fabric-cross-tenant-automation-design.md.
#
# NOTE (live runs blocked — see planning/tasks.md #20): a real apply also needs the Fabric
# tenant setting "Service principals can use Fabric APIs" enabled and the CI principal granted
# a Fabric workspace role. plan is read-only and does not create the workspace/database.

on:
  pull_request:
    paths:
      - 'infra/fabric-sql/terraform/**'
      - '.github/workflows/fabric-sql-plan.yml'

permissions:
  contents: read
  id-token: write

env:
  # --- Terraform state backend -> Tenant A (unchanged identity) ---
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # --- azurerm provider (Fabric capacity) -> Tenant B (pinned in providers.tf via TF_VAR_*) ---
  TF_VAR_fabric_client_id: ${{ vars.FABRIC_CLIENT_ID }}
  TF_VAR_fabric_tenant_id: ${{ vars.FABRIC_TENANT_ID }}
  TF_VAR_fabric_subscription_id: ${{ vars.FABRIC_SUBSCRIPTION_ID }}
  TF_VAR_fabric_use_oidc: true
  # --- fabric provider (workspace + SQL DB) -> Tenant B ---
  FABRIC_USE_OIDC: true
  FABRIC_CLIENT_ID: ${{ vars.FABRIC_CLIENT_ID }}
  FABRIC_TENANT_ID: ${{ vars.FABRIC_TENANT_ID }}
  # --- capacity admins: presenter UPNs (the CI SP is auto-added as the caller) ---
  TF_VAR_capacity_admin_members: ${{ vars.FABRIC_CAPACITY_ADMIN_UPNS }}

concurrency:
  group: fabric-sql-terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/fabric-sql/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.12.0'

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init (remote state)
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=fabric-sql/dev.terraform.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan -lock=false \
            -var="location=${{ vars.AZURE_LOCATION }}" \
            -var="location_abbreviation=${{ vars.AZURE_LOCATION_ABBREVIATION }}"
