name: Azure SQL — Terraform destroy

# Tears down the Azure SQL infra module (infra/azure-sql/terraform) in the personal
# sandbox subscription. Runs nightly at 21:00 UK local time (we like to go to bed then) and
# can also be triggered manually.
#
# GitHub Actions cron is UTC-only, so two schedules are registered — one for BST (UTC+1)
# and one for GMT (UTC+0) — and a gate step skips whichever one doesn't actually land at
# 21:00 in Europe/London right now. A manual workflow_dispatch always runs regardless of
# the time gate.
#
# Auth: OIDC (no secrets) — see notes/decisions.md D5. Uses the same remote state as
# azure-sql-apply.yml so destroy knows exactly what apply created.

on:
  schedule:
    - cron: '0 20 * * *'   # 21:00 BST (UTC+1) — summer
    - cron: '0 21 * * *'   # 21:00 GMT (UTC+0) — winter
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true

concurrency:
  group: azure-sql-terraform
  cancel-in-progress: false

jobs:
  destroy:
    name: terraform destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure-sql/terraform
    steps:
      - name: Gate on 21:00 Europe/London (schedule only)
        id: gate
        run: |
          current_hour=$(TZ='Europe/London' date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$current_hour" != "21" ]; then
            echo "It's ${current_hour}:00 in Europe/London, not 21:00 — this is the other DST cron slot. Skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v7

      - name: Set up Terraform
        if: steps.gate.outputs.proceed == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.12.0'

      - name: Terraform init (remote state)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=azure-sql/dev.terraform.tfstate"

      - name: Terraform destroy
        if: steps.gate.outputs.proceed == 'true'
        run: |
          terraform destroy -auto-approve \
            -var="entra_admin_login=${{ vars.SQL_ENTRA_ADMIN_LOGIN }}" \
            -var="entra_admin_object_id=${{ vars.SQL_ENTRA_ADMIN_OBJECT_ID }}"
