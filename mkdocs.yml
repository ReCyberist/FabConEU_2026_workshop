site_name: Azure SQL or Fabric SQL — Infra & Databases as Code
site_description: FabCon Europe 2026 full-day workshop — Jess Pomfret & Rob Sewell
site_author: Jess Pomfret & Rob Sewell
site_url: https://jessandrob.github.io/FabConEU_2026_workshop/
repo_url: https://github.com/JessAndRob/FabConEU_2026_workshop
repo_name: JessAndRob/FabConEU_2026_workshop

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link   # keep Azure SQL / Fabric SQL tabs in sync across pages
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (Material bundles Mermaid.js).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# ── TEASER MODE ───────────────────────────────────────────────────────────────
# The site is public (Pages sites are public even from a private repo), so until the
# reveal we publish ONLY the teaser home page. Real content stays in the repo on main —
# versioned and building locally — but is held out of the published site via exclude_docs
# below. `mkdocs build --strict` stays happy because excluded pages aren't in the nav.
#
#   👉 TO REVEAL THE FULL SITE: delete the `exclude_docs` block below AND un-comment the
#      real nav entries. That one PR is the reveal.
exclude_docs: |
  database/sample-database.md
# ────────────────────────────────────────────────────────────────────────────────

# Navigation — expand as content is written under docs/.
nav:
  - Home: index.md
  # --- Held until reveal (see exclude_docs above) ---
  # - Database as code:
  #     - The sample database: database/sample-database.md
  # - Getting started:
  #     - Prerequisites: setup/prerequisites.md
  # - Infrastructure as code:
  #     - Azure SQL (Terraform): infra/azure-sql.md
  #     - Fabric SQL (Terraform): infra/fabric-sql.md
  # - Database as code:
  #     - SQL projects: database/sql-projects.md
  # - CI/CD:
  #     - GitHub Actions: cicd/github-actions.md
