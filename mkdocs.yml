site_name: Azure SQL or Fabric SQL — Infra & Databases as Code
site_description: FabCon Europe 2026 full-day workshop — Jess Pomfret & Rob Sewell
site_author: Jess Pomfret & Rob Sewell
site_url: https://jessandrob.github.io/FabConEU_2026_workshop/
repo_url: https://github.com/JessAndRob/FabConEU_2026_workshop
repo_name: JessAndRob/FabConEU_2026_workshop

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tooltips   # style abbr/title hovers as proper tooltips (see includes/glossary.md)
    - content.tabs.link   # keep Azure SQL / Fabric SQL tabs in sync across pages
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# The session-clock timing strip at the top of every teaching-section page.
# Markup: includes/clock-*.md · Styling: docs/stylesheets · Live fill: docs/javascripts
extra_css:
  - stylesheets/session-clock.css

extra_javascript:
  - javascripts/session-clock.js

markdown_extensions:
  - admonition
  # `abbr` + `snippets.auto_append` give every page the shared glossary in
  # includes/glossary.md, so acronyms and British idioms get a hover translation
  # without any per-page markup. See CLAUDE.md §5 (Voice).
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/glossary.md
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        # Render ```mermaid blocks as diagrams (Material bundles Mermaid.js).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

# ── TEASER MODE ───────────────────────────────────────────────────────────────
# The site is public (Pages sites are public even from a private repo), so until the
# reveal we publish ONLY the teaser home page. Real content stays in the repo on main —
# versioned and building locally — but is held out of the published site via exclude_docs
# below. `mkdocs build --strict` stays happy because excluded pages aren't in the nav.
#
#   👉 TO PREVIEW THE FULL SITE LOCALLY (without publishing): `mkdocs serve -f mkdocs.local.yml`
#      — that overlay inherits this config, clears exclude_docs and supplies the full nav.
#   👉 TO REVEAL THE FULL SITE: delete the `exclude_docs` block below AND un-comment the
#      real nav entries (they mirror mkdocs.local.yml). That one PR is the reveal.
exclude_docs: |
  database/sample-database.md
  setup/welcome.md
  foundations/hardest-part-of-it.md
  foundations/source-control.md
  foundations/demo.md
  infra/azure-sql.md
  infra/fabric-sql.md
  infra/demo.md
  database/sql-projects.md
  database/demo.md
  lunch.md
  cicd/build-validate.md
  cicd/deploy-infra.md
  cicd/ship-database-changes.md
  cicd/demo.md
  wrap-up/migrations-drift-teardown.md
  wrap-up/resources.md
  reference/other-tooling.md
# ────────────────────────────────────────────────────────────────────────────────

# Navigation — the full site tree lives here but stays COMMENTED until reveal.
nav:
  - Home: index.md
  - Getting started:
      - Prerequisites: setup/prerequisites.md
  # --- Held until reveal: delete remaining exclude_docs entries AND uncomment below ---
  # On reveal, `Welcome & how the day works` moves ABOVE `Prerequisites` in the
  # `Getting started` section above — Welcome sets up the day and ends by sending
  # the reader to Prerequisites, so it has to come first.
  # - Getting started:
  #     - Welcome & how the day works: setup/welcome.md
  #     - Prerequisites: setup/prerequisites.md
  # - Foundations:
  #     - The hardest part of IT: foundations/hardest-part-of-it.md
  #     - Source control for databases: foundations/source-control.md
  #     - Demo: foundations/demo.md
  # - Infrastructure as code:
  #     - Azure SQL (Terraform): infra/azure-sql.md
  #     - Fabric SQL (Terraform): infra/fabric-sql.md
  #     - Demo: infra/demo.md
  # - Database as code:
  #     - The sample database: database/sample-database.md
  #     - SQL projects: database/sql-projects.md
  #     - Demo: database/demo.md
  # - Lunch: lunch.md
  # - CI/CD:
  #     - Build & validate: cicd/build-validate.md
  #     - Deploy infrastructure: cicd/deploy-infra.md
  #     - Ship database changes: cicd/ship-database-changes.md
  #     - Demo: cicd/demo.md
  # - Wrap up:
  #     - Migrations, drift & teardown: wrap-up/migrations-drift-teardown.md
  #     - Resources & next steps: wrap-up/resources.md
  # - Reference:
  #     - Other tooling: reference/other-tooling.md
